# Render blueprint for the Kerb back end. In Render: New > Blueprint > pick this repo.
# Secrets are marked sync: false, so Render asks for them when the blueprint is created.
services:
  - type: web
    name: kerb-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_DEMO_ACCOUNT_ID
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: google/gemini-2.5-flash
      - key: OPENROUTER_COMPARE_MODEL
        value: anthropic/claude-sonnet-4.5
      - key: FRONTEND_URL
        sync: false
      - key: DEMO_SPEEDUP
        value: "60"
